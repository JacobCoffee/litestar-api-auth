name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Scoped to read-only: this job runs the `uv_build` PEP 517 backend via
  # `uv build` and must not have access to the PyPI Trusted Publishing OIDC
  # token granted below to the publish-release job. `uv`'s pinned version
  # (0.9.11) matches pyproject.toml's exact `uv_build==0.9.11` requirement,
  # so uv uses its own bundled copy of the backend instead of fetching the
  # `uv_build` package from PyPI at build time -- keep these two versions in
  # lockstep so that stays true.
  # Restrict manual runs to tag refs: a bare `workflow_dispatch` trigger lets
  # any collaborator with write access dispatch this workflow against an
  # arbitrary branch or commit, publishing it to PyPI outside the normal
  # release flow. Tags require a maintainer to push/create them (and should
  # carry a tag protection ruleset), so gating on `ref_type == 'tag'` closes
  # that arbitrary-ref gap; `release` events always fire with a tag ref too,
  # so the normal release flow is unaffected.
  build:
    name: Build package
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref_type == 'tag'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          enable-cache: true
          version: "0.9.11"

      - name: Build package
        run: uv build

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-release:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
