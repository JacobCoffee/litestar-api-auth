name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Scoped to read-only: this job runs the `uv_build` PEP 517 backend via
  # `uv build` and must not have access to the PyPI Trusted Publishing OIDC
  # token granted below to the publish-release job. `uv`'s pinned version
  # (0.9.11) matches pyproject.toml's exact `uv_build==0.9.11` requirement,
  # so uv uses its own bundled copy of the backend instead of fetching the
  # `uv_build` package from PyPI at build time -- keep these two versions in
  # lockstep so that stays true.
  # Restrict manual runs to tag refs dispatched by the repo owner: a bare
  # `workflow_dispatch` trigger lets any collaborator with write access
  # dispatch this workflow against an arbitrary branch or commit, publishing
  # it to PyPI outside the normal release flow. Gating on `ref_type == 'tag'`
  # alone isn't sufficient on its own: any write collaborator can create a
  # tag pointing at any commit just as easily, and that gate's safety was
  # assumed to rest on a tag protection ruleset and `pypi` environment
  # protection rules -- neither of which is actually configured on this repo
  # (verified via the GitHub API: only a branch ruleset exists, and the
  # `pypi` environment's `protection_rules` is empty). Requiring
  # `github.event_name == 'workflow_dispatch' && ... && github.actor ==
  # github.repository_owner` closes that gap for dispatches of *this* file's
  # current definition, without depending on those unconfigured,
  # unauditable-from-this-repo settings: only the owner can trigger a manual
  # dispatch, regardless of who else has write access or what tags they
  # create. `release` events always fire with a tag ref too and are left
  # unrestricted, so the normal release flow (cutting a GitHub Release) is
  # unaffected.
  #
  # IMPORTANT CAVEAT: `workflow_dispatch` evaluates the workflow definition
  # as it exists at the *dispatched ref*, not this file's current contents.
  # A write collaborator can still tag (or author a new commit reverting to)
  # an older revision of this file that predates this guard entirely --
  # e.g. commit a70f721, which already set `environment: pypi` and
  # `id-token: write` with a bare, unrestricted `workflow_dispatch` -- and
  # dispatch against that ref to bypass this check completely. Closing that
  # requires the `pypi` environment's required-reviewers protection rule
  # (enforced by GitHub at the environment level for *any* workflow revision
  # that references it) and/or a tag protection ruleset restricting who can
  # create tags; this inline check is defense-in-depth only, not a
  # substitute for configuring those.
  build:
    name: Build package
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && github.actor == github.repository_owner)
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          enable-cache: true
          version: "0.9.11"

      - name: Build package
        run: uv build

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-release:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
